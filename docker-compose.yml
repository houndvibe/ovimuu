# Development only: local PostgreSQL 16.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ovimuu
      POSTGRES_PASSWORD: ovimuu
      POSTGRES_DB: ovimuu
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ovimuu -d ovimuu']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
